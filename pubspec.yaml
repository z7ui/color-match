name: color_match
description: "选色助手：把不同环境拍的照片拉到同一光线基准，比较瓷砖 / 门窗 / 美缝的颜色差异。"
publish_to: 'none'

version: 0.1.21+22

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  camera: ^0.12.2
  image: ^4.13.1
  sqflite: ^2.4.6
  path_provider: ^2.1.6
  path: ^1.9.1
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
  permission_handler: ^13.0.2
  uuid: ^4.6.0
  gal: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
